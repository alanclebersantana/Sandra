<title>Sandra Silveira · Revendedora</title>
<!--
  ============================================================
  SANDRA SILVEIRA · Gestão para Revendedora
  Arquivo único (HTML + CSS + JS), sem build.

  MODO LOCAL: com FIREBASE_CONFIG vazio, tudo fica salvo no
  próprio aparelho (localStorage) — ideal para testar.

  MODO FIREBASE (sincroniza celular e PC + loja online):
   1. Crie um projeto no Firebase e ative Authentication > E-mail/senha.
      No primeiro acesso, a Sandra toca em "Criar conta" no próprio app
      (depois disso a opção "Criar conta" some da tela de login).
   2. Ative o Firestore e cole as regras abaixo.
   3. Preencha FIREBASE_CONFIG logo no início do <script>.
   4. Link da loja: index.html?loja=UID (aparece em Configurações).
  5. Publique no GitHub Pages junto com: manifest.json, sw.js,
     icon-192.png, icon-512.png, icon-maskable-512.png, apple-touch-icon.png
     (ao publicar versão nova, troque a VERSAO no sw.js).

  REGRAS DO FIRESTORE:
  rules_version = '2';
  service cloud.firestore {
    match /databases/{db}/documents {
      match /users/{uid}/{doc=**} {
        allow read, write: if request.auth != null && request.auth.uid == uid;
      }
      match /lojas/{uid} {
        allow read: if true;
        allow write: if request.auth != null && request.auth.uid == uid;
      }
      match /app/dono {
        allow read: if true;
        allow create: if request.auth != null && request.resource.data.uid == request.auth.uid;
        allow update, delete: if false;
      }
      match /lojas/{uid}/pedidos/{id} {
        allow create: if request.resource.data.keys().hasOnly(['nome','telefone','itens','total','obs','criadoEm','status'])
                      && request.resource.data.status == 'novo'
                      && request.resource.data.nome is string && request.resource.data.nome.size() < 120
                      && request.resource.data.itens is list && request.resource.data.itens.size() < 100;
        allow read, update, delete: if request.auth != null && request.auth.uid == uid;
      }
    }
  }
  ============================================================
-->

const isoDate = d => d.getFullYear() + '-' + z2(d.getMonth() + 1) + '-' + z2(d.getDate());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); };
const hoje = () => isoDate(new Date());
const addDias = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return isoDate(d); };
const addMeses = (iso, n) => { const d = parseISO(iso), dia = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
  d.setDate(Math.min(dia, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return isoDate(d); };
const mesDe = iso => (iso || '').slice(0, 7);
const mesAtual = () => hoje().slice(0, 7);
const mesAdd = (m, n) => addMeses(m + '-01', n).slice(0, 7);
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const mesNome = m => cap(parseISO(m + '-01').toLocaleDateString('pt-BR', {month:'long', year:'numeric'}));
const mesCurto = m => parseISO(m + '-01').toLocaleDateString('pt-BR', {month:'short'}).replace('.', '');
const fmtData = iso => iso ? iso.split('-').reverse().join('/') : '';
const fmtDM = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '';
const dataExtenso = iso => cap(parseISO(iso).toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'}));
const diaSemana = iso => parseISO(iso).toLocaleDateString('pt-BR', {weekday:'short'}).replace('.', '');
const soDig = s => String(s || '').replace(/\D/g, '');
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const primeiroNome = n => String(n || '').trim().split(/\s+/)[0] || '';
const iniciais = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const limpo = o => JSON.parse(JSON.stringify(o));
const fmtTel = t => { const d = soDig(t); if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return t || ''; };
const waNum = t => { let d = soDig(t); if (d.length <= 11) d = '55' + d; return d; };
const waLink = (t, msg) => `https://wa.me/${waNum(t)}?text=${encodeURIComponent(msg || '')}`;

// ---------- regras de negócio ----------
const pagoV = v => sum((v.pagamentos || []).map(p => p.valor));
const saldo = v => Math.max(0, r2((+v.total || 0) - pagoV(v)));
function parcelasAbertas(v) {
  let pago = pagoV(v);
  const entrada = sum((v.pagamentos || []).filter(p => p.forma === 'Entrada').map(p => p.valor));
  pago = r2(pago - entrada);
  const ps = (v.parcelas && v.parcelas.length) ? v.parcelas : [{venc:v.vencimento || v.data, valor:r2(v.total - entrada)}];
  const out = [];
  ps.forEach((p, i) => { const cobre = Math.min(pago, p.valor); pago = r2(pago - cobre); const resta = r2(p.valor - cobre);
    if (resta > 0.009) out.push({...p, n:i + 1, de:ps.length, resta}); });
  return out;
}
const atrasada = v => saldo(v) > 0 && parcelasAbertas(v).some(p => p.venc < hoje());
function statusTag(v) {
  const s = saldo(v);
  if (s <= 0.009) return '<span class="tag ok">Pago</span>';
  if (atrasada(v)) return `<span class="tag bad">Atrasado · ${brl(s)}</span>`;
  return `<span class="tag warn">Falta ${brl(s)}</span>`;
}
const cliPorId = id => DB.clientes.find(c => c.id === id);
const telVenda = v => (cliPorId(v.clienteId) || {}).telefone || v.telefone || '';
const resumoItens = v => { const n = (v.itens || []).map(i => (i.qtd > 1 ? i.qtd + '× ' : '') + i.nome); return n.length > 2 ? n.slice(0, 2).join(', ') + ` e +${n.length - 2}` : n.join(', '); };
const nomesProdutos = v => { const n = (v.itens || []).map(i => i.nome); return n.length > 2 ? n.slice(0, 2).join(', ') + ' e os outros itens' : n.join(' e '); };
const saldoCliente = id => sum(DB.vendas.filter(v => v.clienteId === id).map(saldo));

function cobrancasPendentes() {
  const lim = addDias(hoje(), 3), out = [];
  DB.vendas.forEach(v => { if (saldo(v) <= 0.009) return; const p = parcelasAbertas(v)[0]; if (p && p.venc <= lim) out.push({v, p}); });
  return out.sort((a, b) => a.p.venc.localeCompare(b.p.venc));
}
function alertasEstoque() {
  const lim = addDias(hoje(), 30);
  return DB.produtos.filter(p => p.ativo !== false).map(p => {
    const min = p.min !== '' && p.min != null ? +p.min : +CFG.estoqueMin;
    const baixo = (+p.qtd || 0) <= min, venc = p.validade && p.validade <= lim;
    return (baixo || venc) ? {p, baixo, venc} : null;
  }).filter(Boolean);
}
function resumoMes(m) {
  const vs = DB.vendas.filter(v => mesDe(v.data) === m);
  const vendas = sum(vs.map(v => v.total));
  const custo = sum(vs.flatMap(v => v.itens || []).map(i => (+i.custo || 0) * (+i.qtd || 0)));
  const ls = DB.lancamentos.filter(l => mesDe(l.data) === m);
  const despesas = sum(ls.filter(l => l.tipo === 'despesa' && l.categoria !== 'Compra de estoque').map(l => l.valor));
  const compras = sum(ls.filter(l => l.tipo === 'despesa' && l.categoria === 'Compra de estoque').map(l => l.valor));
  const receitas = sum(ls.filter(l => l.tipo === 'receita').map(l => l.valor));
  const recebido = sum(DB.vendas.flatMap(v => v.pagamentos || []).filter(p => mesDe(p.data) === m).map(p => p.valor));
  return {vendas, qtd:vs.length, custo, despesas, compras, receitas, recebido, lucro:r2(vendas - custo - despesas + receitas), caixa:r2(recebido + receitas - despesas - compras)};
}
function progressoMetas(m) {
  return { vendas: resumoMes(m).vendas,
    clientes: DB.clientes.filter(c => mesDe(c.criadoEm) === m).length };
}

let V = {tela:'inicio', arg:null}, PILHA = [];
const UI = {buscaCli:'', buscaProd:'', catProd:'', filtroProd:'todos', mesV:mesAtual(), filtroV:'mes', mesF:mesAtual(), agMes:mesAtual(), agDia:hoje(), enviados:{}, buscaDiv:'', tplDiv:'promocao'};
const ABAS = [['inicio','Início'], ['clientes','Clientes'], ['agenda','Agenda'], ['vendas','Vendas'], ['estoque','Estoque'], ['mais','Mais']];
const PAI = {cliente:'clientes', financeiro:'mais', metas:'mais', pedidos:'mais', mensagens:'mais', config:'mais', divulgar:'mais'};

// ---------- navegação: o voltar do celular nunca fecha o app ----------
function ir(tela, arg) { PILHA.push(V); if (PILHA.length > 60) PILHA.shift(); V = {tela, arg:arg || null}; window.scrollTo(0, 0); render(); }
function aba(t) {
  if (V.tela !== t || V.arg) { PILHA.push(V); if (PILHA.length > 60) PILHA.shift(); }
  V = {tela:t, arg:null}; window.scrollTo(0, 0); render();
}
function voltarInterno() {
  let ant = PILHA.pop();
  while (ant && ant.tela === V.tela && ant.arg === V.arg) ant = PILHA.pop();
  V = ant || {tela:PAI[V.tela] || 'inicio', arg:null}; window.scrollTo(0, 0); render();
}
function voltar() { voltarInterno(); }

let sheetAberto = false, aposFechar = null;
function abrirSheet(html) {
  $('#sheet').innerHTML = '<div class="grip"></div>' + html; $('#sheet').scrollTop = 0;
  $('#sheetWrap').classList.add('on'); sheetAberto = true;
}
function fecharSheetAgora() {
  sheetAberto = false; $('#sheetWrap').classList.remove('on');
  if (aposFechar) { const f = aposFechar; aposFechar = null; f(); }
}
function fecharSheet(depois) {
  aposFechar = depois || null;
  if (sheetAberto) fecharSheetAgora(); else if (aposFechar) { const f = aposFechar; aposFechar = null; f(); }
}

// Trava do botão/gesto de voltar: sempre existe uma "página extra" no histórico.
// Quando o celular tenta voltar, o app consome isso, volta uma tela por dentro e recoloca a trava.
const TRAVA = !PARAMS.has('loja');           // a loja pública das clientes funciona normal
let travaOk = false, travaPendente = false;
function colocarTrava() { if (!TRAVA) return; try { history.pushState({trava:Date.now()}, ''); travaOk = true; } catch (e) {} }
function acaoVoltar() {
  if ($('#dlg').classList.contains('on')) { $('#dlg').classList.remove('on'); return; }
  if (sheetAberto) { fecharSheet(); return; }
  if (LOJA_PREVIEW) { sairLoja(); return; }
  if (LOJA_ID !== null || (USE_FB && !USER)) return;   // tela de login: só fica
  if (PILHA.length) { voltarInterno(); return; }
  if (V.tela !== 'inicio') { V = {tela:PAI[V.tela] || 'inicio', arg:null}; window.scrollTo(0, 0); render(); return; }
  toast('Você está no início');
}
window.addEventListener('popstate', () => {
  if (!TRAVA) return;
  acaoVoltar();
  colocarTrava(); travaPendente = true;   // recoloca já e reforça no próximo toque
});
// O Chrome pode ignorar entradas criadas sem toque do usuário; reforça a trava a cada interação
['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => {
  if (!TRAVA) return;
  if (!travaOk || travaPendente) { travaPendente = false; colocarTrava(); }
}, {capture:true, passive:true}));
if (TRAVA) { try { history.replaceState({base:1}, ''); } catch (e) {} colocarTrava(); }

function render() {
  if (LOJA_ID !== null) return;
  if (USE_FB && !USER) return;
  const fn = TELAS[V.tela] || TELAS.inicio;
  const r = fn(V.arg);
  const cab = r.voltar
    ? `<header class="top sub"><button class="back" onclick="voltar()" aria-label="Voltar">${I.voltar}</button><h1>${esc(r.titulo)}</h1>${r.acao || ''}</header>`
    : `<header class="top"><div><div class="cav brand">${esc(CFG.nome)}</div><div class="sub-brand">${esc(CFG.titulo)}</div></div>${r.acao || ''}</header>`;
  $('#app').innerHTML = cab + `<main class="main">${r.html}</main>` + (r.fab || '');
  const ativa = PAI[V.tela] || V.tela, nPed = DB.pedidos.filter(p => p.status === 'novo').length, nAl = alertasEstoque().length;
  $('#nav').innerHTML = '<div class="in">' + ABAS.map(([k, t]) => `<button class="${ativa === k ? 'on' : ''}" onclick="aba('${k}')">${I[k]}${t}${k === 'mais' && nPed ? `<span class="dot">${nPed}</span>` : ''}${k === 'estoque' && nAl ? `<span class="dot">${nAl}</span>` : ''}</button>`).join('') + '</div>';
  if (r.depois) r.depois();
}
const vazio = (t, s) => `<div class="empty"><span class="cav">${t}</span>${s ? `<div class="sm">${s}</div>` : ''}</div>`;
const secao = (t, acao) => `<div class="sec-t"><h2>${t}</h2>${acao || ''}</div>`;
const opts = (arr, sel) => arr.map(x => `<option ${x === sel ? 'selected' : ''}>${esc(x)}</option>`).join('');

// =====================================================================
// TELAS
// =====================================================================
const TELAS = {};

function cardVitrine() {
  const nVit = DB.produtos.filter(p => p.ativo !== false && p.vitrine).length;
  return `<div class="card vit-card"><div class="row"><div class="av">🛍️</div><div class="grow"><b>Sua Loja - Vitrine</b>
    <div class="muted sm">${nVit} produto${nVit === 1 ? '' : 's'} à mostra para as clientes</div></div></div>
    <div class="btns" style="margin-top:10px"><button class="btn sm" onclick="abrirLoja()">Ver vitrine</button><button class="btn sm sec" onclick="copiar(linkLoja())">Copiar link</button><button class="btn sm ghost" onclick="compartilharLoja()">Compartilhar</button></div></div>`;
}
// ---------- INÍCIO ----------
TELAS.inicio = () => {
  const m = mesAtual(), R = resumoMes(m), aReceber = sum(DB.vendas.map(saldo));
  const agHoje = DB.agenda.filter(a => a.data === hoje()).sort((a, b) => (a.hora || '').localeCompare(b.hora || ''));
  const cobr = cobrancasPendentes(), alertas = alertasEstoque();
  const peds = DB.pedidos.filter(p => p.status === 'novo');
  const meta = +CFG.metas.vendas || 0, pct = meta ? Math.min(100, R.vendas / meta * 100) : 0;
  const ok1 = !!soDig(CFG.whatsapp), ok2 = DB.produtos.length > 0, ok3 = DB.clientes.length > 0, semDados = !(ok1 && ok2 && ok3) && !DB.vendas.length;
  let h = `<div class="hello"><div class="cav">Olá, ${esc(primeiroNome(CFG.nome))}!</div><div class="muted">${dataExtenso(hoje())}</div></div>`;
  h += cardVitrine();
  if (semDados) h += `<div class="card" style="padding:16px"><div class="cav" style="font-size:28px;color:var(--acc)">Vamos começar?</div>
    <p class="muted sm" style="margin:4px 0 12px">Três passos para deixar tudo pronto:</p>
    <button class="opt" onclick="ir('config')"><span class="opt-e">1</span><span class="grow"><b>Seu WhatsApp e a loja</b><span class="sm muted">Para receber os pedidos das clientes</span></span>${ok1 ? '<span class="tag ok">✓ feito</span>' : I.dir}</button>
    <button class="opt" onclick="aba('estoque');setTimeout(formProduto,50)"><span class="opt-e">2</span><span class="grow"><b>Cadastrar produtos</b><span class="sm muted">Com foto, preço e estoque</span></span>${ok2 ? '<span class="tag ok">✓ feito</span>' : I.dir}</button>
    <button class="opt" onclick="formCliente()"><span class="opt-e">3</span><span class="grow"><b>Cadastrar clientes</b><span class="sm muted">Nome e WhatsApp</span></span>${ok3 ? '<span class="tag ok">✓ feito</span>' : I.dir}</button></div>`;
  if (peds.length) h += `<div class="card row click" style="border-color:var(--acc)" onclick="ir('pedidos')"><div class="av">🛍️</div><div class="grow"><b>${peds.length} pedido${peds.length > 1 ? 's' : ''} novo${peds.length > 1 ? 's' : ''} na loja</b><div class="muted sm">Toque para ver e confirmar</div></div>${I.dir}</div>`;
  h += `<div class="kpis">
    <div class="kpi" onclick="UI.filtroV='mes';UI.mesV=mesAtual();aba('vendas')"><span>Vendas do mês</span><b>${brl(R.vendas)}</b></div>
    <div class="kpi" onclick="UI.filtroV='aberto';aba('vendas')"><span>A receber</span><b>${brl(aReceber)}</b></div>
    <div class="kpi" onclick="ir('financeiro')"><span>Lucro do mês</span><b class="${R.lucro < 0 ? 'neg' : ''}">${brl(R.lucro)}</b></div></div>`;
  if (meta) h += `<div class="card click" style="margin-top:10px" onclick="ir('metas')"><div class="row"><b class="grow">Meta de vendas</b><span class="sm muted">${brl(R.vendas)} de ${brl(meta)}</span></div><div class="bar ${pct >= 100 ? 'ok' : ''}"><i style="width:${pct}%"></i></div>
    <div class="xs muted" style="margin-top:4px">${pct >= 100 ? 'Meta batida! 🎉' : `Faltam ${brl(meta - R.vendas)} · ${Math.round(pct)}%`}</div></div>`;

  h += secao('Hoje na agenda', `<button class="link" onclick="formAgenda(null,{data:hoje()})">+ Agendar</button>`);
  h += agHoje.length ? agHoje.map(itemAgenda).join('') : `<div class="card muted sm">Nada agendado para hoje.</div>`;

  if (cobr.length) {
    h += secao(`Cobranças <span class="tag bad">${cobr.length}</span>`);
    h += cobr.map(({v, p}) => `<div class="card row"><div class="grow click" onclick="detalheVenda('${v.id}')"><b class="ell">${esc(v.clienteNome || 'Venda avulsa')}</b>
      <div class="sm ${p.venc < hoje() ? 'neg' : 'muted'}">${brl(p.resta)} · ${p.venc < hoje() ? 'venceu' : 'vence'} ${fmtDM(p.venc)}${p.de > 1 ? ` · parcela ${p.n}/${p.de}` : ''}</div></div>
      <button class="ic wa" onclick="cobrar('${v.id}')" title="Cobrar no WhatsApp">${I.wa}</button><button class="btn sm sec" onclick="formPagamento('${v.id}')">Receber</button></div>`).join('');
  }
  if (alertas.length) {
    h += secao('Estoque e validade', `<button class="link" onclick="aba('estoque')">Ver estoque</button>`);
    h += alertas.slice(0, 8).map(({p, baixo, venc}) => `<div class="card row click" onclick="formProduto('${p.id}')"><div class="grow"><b class="ell">${esc(p.nome)}</b>
      <div class="muted sm">${esc(p.marca || '')}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${baixo ? `<span class="tag ${(+p.qtd || 0) <= 0 ? 'bad' : 'warn'}">${+p.qtd || 0} em estoque</span>` : ''}${venc ? `<span class="tag ${p.validade < hoje() ? 'bad' : 'warn'}">${p.validade < hoje() ? 'Venceu' : 'Vence'} ${fmtData(p.validade)}</span>` : ''}</div></div></div>`).join('');
  }
  return {html:h, fab:`<button class="fab" onclick="formVenda()">+ Nova venda</button>`};
};

// ---------- CLIENTES ----------
TELAS.clientes = () => ({
  html:`<div class="toolbar"><input class="busca" type="search" placeholder="Buscar por nome ou telefone…" value="${esc(UI.buscaCli)}" oninput="UI.buscaCli=this.value;listaClientes()"></div>
    <div class="sm muted" style="margin:0 4px 8px">${DB.clientes.length} cliente${DB.clientes.length === 1 ? '' : 's'}</div><div id="listaCli"></div>`,
  depois:listaClientes, fab:`<button class="fab" onclick="formCliente()">+ Nova cliente</button>`
});
function listaClientes() {
  const q = norm(UI.buscaCli), qd = soDig(UI.buscaCli);
  const l = DB.clientes.filter(c => !q || norm(c.nome).includes(q) || (qd && soDig(c.telefone).includes(qd))).sort((a, b) => a.nome.localeCompare(b.nome));
  $('#listaCli').innerHTML = l.length ? l.map(c => { const s = saldoCliente(c.id);
    return `<div class="card row click" onclick="ir('cliente','${c.id}')"><div class="av">${esc(iniciais(c.nome))}</div><div class="grow"><b class="ell" style="display:block">${esc(c.nome)}</b>
      <div class="muted sm ell">${esc(fmtTel(c.telefone)) || 'sem telefone'}</div></div>${s > 0 ? `<span class="tag ${DB.vendas.some(v => v.clienteId === c.id && atrasada(v)) ? 'bad' : 'warn'}">${brl(s)}</span>` : ''}</div>`; }).join('')
    : vazio(DB.clientes.length ? 'Ninguém encontrado' : 'Nenhuma cliente ainda', DB.clientes.length ? '' : 'Toque em “+ Nova cliente” para começar.');
}
TELAS.cliente = id => {
  const c = cliPorId(id);
  if (!c) return {titulo:'Cliente', voltar:1, html:vazio('Cliente não encontrada')};
  const vs = DB.vendas.filter(v => v.clienteId === id).sort((a, b) => b.data.localeCompare(a.data));
  const tot = sum(vs.map(v => v.total)), sal = sum(vs.map(saldo));
  const ags = DB.agenda.filter(a => a.clienteId === id && a.data >= hoje()).sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));
  const indicou = DB.clientes.filter(x => x.indicadaPor && norm(x.indicadaPor) === norm(c.nome));
  const info = [['Cliente desde', fmtData(c.criadoEm)], ['E-mail', c.email], ['Endereço', c.endereco],
    ['Preferências', c.preferencias], ['Indicada por', c.indicadaPor], ['Indicou', indicou.map(x => x.nome).join(', ')], ['Observações', c.obs]].filter(x => x[1]);
  let h = `<div class="card"><div class="row"><div class="av big">${esc(iniciais(c.nome))}</div><div class="grow"><b style="font-size:18px">${esc(c.nome)}</b><div class="muted">${esc(fmtTel(c.telefone)) || 'sem telefone'}</div></div></div>
    <div class="btns" style="margin-top:12px">
      <button class="btn sm sec" onclick="waCli('${c.id}')">WhatsApp</button>
      ${soDig(c.telefone) ? `<a class="btn sm ghost" style="text-align:center;text-decoration:none" href="tel:${soDig(c.telefone)}">Ligar</a>` : ''}
      <button class="btn sm ghost" onclick="formCliente('${c.id}')">Editar</button></div></div>
  <div class="kpis"><div class="kpi"><span>Comprou</span><b>${brl(tot)}</b></div><div class="kpi"><span>Em aberto</span><b class="${sal > 0 ? 'neg' : ''}">${brl(sal)}</b></div><div class="kpi"><span>Compras</span><b>${vs.length}</b></div></div>`;
  if (info.length) h += `<div class="card" style="margin-top:10px"><table class="tbl">${info.map(([k, v]) => `<tr><td class="muted">${k}</td><td style="white-space:normal">${esc(v)}</td></tr>`).join('')}</table></div>`;
  h += `<div class="btns" style="margin:12px 0"><button class="btn" onclick="formVenda(null,{clienteId:'${c.id}'})">+ Venda</button><button class="btn sec" onclick="formAgenda(null,{clienteId:'${c.id}'})">+ Agendar</button></div>`;
  if (ags.length) h += secao('Próximos compromissos') + ags.map(itemAgenda).join('');
  h += secao('Compras') + (vs.length ? vs.map(cardVenda).join('') : `<div class="card muted sm">Nenhuma compra registrada.</div>`);
  h += `<div class="center" style="margin:22px 0"><button class="link" style="color:var(--bad)" onclick="excluirCliente('${c.id}')">Excluir cliente</button></div>`;
  return {titulo:c.nome, voltar:1, html:h};
};
function formCliente(id, pre) {
  const c = id ? cliPorId(id) : {...(pre || {})};
  abrirSheet(`<h3>${id ? 'Editar cliente' : 'Nova cliente'}</h3>
  <form id="fc" onsubmit="return salvarCliente(event,'${id || ''}')">
    <label class="f"><span>Nome *</span><input name="nome" required value="${esc(c.nome)}" autocomplete="off"></label>
    <div class="g2"><label class="f"><span>WhatsApp</span><input name="telefone" type="tel" inputmode="tel" placeholder="(00) 00000-0000" value="${esc(fmtTel(c.telefone))}"></label>
    <label class="f"><span>E-mail</span><input name="email" type="email" value="${esc(c.email)}"></label></div>
    <label class="f"><span>Endereço</span><input name="endereco" value="${esc(c.endereco)}"></label>
    <label class="f"><span>Indicada por</span><input name="indicadaPor" list="dlCliNomes" value="${esc(c.indicadaPor)}"></label>
    <datalist id="dlCliNomes">${DB.clientes.filter(x => x.id !== id).map(x => `<option value="${esc(x.nome)}">`).join('')}</datalist>
    <label class="f"><span>Preferências</span><input name="preferencias" value="${esc(c.preferencias)}"></label>
    <label class="f"><span>Observações</span><textarea name="obs">${esc(c.obs)}</textarea></label>
    <div class="btns"><button type="button" class="btn ghost" onclick="fecharSheet()">Cancelar</button><button class="btn">Salvar</button></div>
  </form>`);
}
function salvarCliente(e, id) {
  e.preventDefault(); const f = e.target, base = id ? cliPorId(id) : {criadoEm:hoje()};
  const c = {...base, nome:f.nome.value.trim(), telefone:soDig(f.telefone.value), email:f.email.value.trim(), endereco:f.endereco.value.trim(),
    indicadaPor:f.indicadaPor.value.trim(), preferencias:f.preferencias.value.trim(), obs:f.obs.value.trim()};
  const gravar = () => {
    salvar('clientes', c, true);
    DB.vendas.filter(v => v.clienteId === c.id && v.clienteNome !== c.nome).forEach(v => { v.clienteNome = c.nome; salvar('vendas', v, true); });
    fecharSheet(() => { if (!id) ir('cliente', c.id); else render(); });
    toast('Cliente salva ✓');
  };
  if (!id && DB.clientes.some(x => norm(x.nome) === norm(c.nome))) perguntar('Já existe uma cliente com esse nome. Cadastrar mesmo assim?', gravar, 'Cadastrar', false);
  else gravar();
  return false;
}
function excluirCliente(id) {
  perguntar('Excluir esta cliente? As vendas dela continuam registradas.', () => { excluir('clientes', id); voltar(); toast('Cliente excluída'); }, 'Excluir');
}
function waCli(id) { const c = cliPorId(id); wa(c.telefone, 'Oi ' + primeiroNome(c.nome) + '! '); }

// ---------- AGENDA ----------
function itemAgenda(a) {
  const c = cliPorId(a.clienteId);
  return `<div class="card row ${a.feito ? 'feito' : ''}"><button class="chk ${a.feito ? 'on' : ''}" onclick="toggleFeito('${a.id}')">✓</button>
    <div class="grow click" onclick="formAgenda('${a.id}')"><b class="ell" style="display:block">${a.hora || '--:--'} · ${esc(a.titulo || a.tipo)}</b>
    <div class="muted sm ell">${V.tela !== 'agenda' && a.data !== hoje() ? diaSemana(a.data) + ' ' + fmtDM(a.data) + ' · ' : ''}${esc(a.tipo)}${c ? ' · ' + esc(c.nome) : ''}</div></div>
    ${c && soDig(c.telefone) && !a.feito ? `<button class="ic wa" onclick="lembrete('${a.id}')" title="Lembrete">${I.wa}</button>` : ''}</div>`;
}
TELAS.agenda = () => {
  const m = UI.agMes, [y, mm] = m.split('-').map(Number), ini = new Date(y, mm - 1, 1).getDay(), dias = new Date(y, mm, 0).getDate();
  const tem = new Set(DB.agenda.filter(a => mesDe(a.data) === m).map(a => a.data));
  let cal = ['D','S','T','Q','Q','S','S'].map(d => `<div class="h">${d}</div>`).join('') + '<div></div>'.repeat(ini);
  for (let d = 1; d <= dias; d++) { const iso = `${m}-${z2(d)}`;
    cal += `<div class="d ${iso === hoje() ? 'hoje' : ''} ${iso === UI.agDia ? 'sel' : ''}" onclick="UI.agDia='${iso}';render()">${d}${tem.has(iso) ? '<i></i>' : ''}</div>`; }
  const doDia = DB.agenda.filter(a => a.data === UI.agDia).sort((a, b) => (a.hora || '').localeCompare(b.hora || ''));
  const prox = DB.agenda.filter(a => a.data > UI.agDia && !a.feito).sort((a, b) => (a.data + (a.hora || '')).localeCompare(b.data + (b.hora || ''))).slice(0, 8);
  let h = `<div class="card"><div class="mnav"><button class="ic" onclick="UI.agMes=mesAdd(UI.agMes,-1);render()">${I.esq}</button><b>${mesNome(m)}</b><button class="ic" onclick="UI.agMes=mesAdd(UI.agMes,1);render()">${I.dir}</button></div>
    <div class="cal">${cal}</div>${m !== mesAtual() || UI.agDia !== hoje() ? `<div class="center"><button class="link sm" onclick="UI.agMes=mesAtual();UI.agDia=hoje();render()">Voltar para hoje</button></div>` : ''}</div>`;
  h += secao(dataExtenso(UI.agDia), `<button class="link" onclick="formAgenda(null,{data:UI.agDia})">+ Adicionar</button>`);
  h += doDia.length ? doDia.map(itemAgenda).join('') : `<div class="card muted sm">Nenhum compromisso neste dia.</div>`;
  if (prox.length) h += secao('Próximos') + prox.map(a => itemAgenda(a).replace('</b>', `</b>`).replace('<div class="muted sm ell">', `<div class="muted sm ell">${diaSemana(a.data)} ${fmtDM(a.data)} · `)).join('');
  return {html:h, fab:`<button class="fab" onclick="formAgenda(null,{data:UI.agDia})">+ Agendar</button>`};
};
function formAgenda(id, pre) {
  const a = id ? DB.agenda.find(x => x.id === id) : {data:hoje(), hora:'', tipo:'Visita', ...(pre || {})};
  const clis = [...DB.clientes].sort((x, y) => x.nome.localeCompare(y.nome));
  abrirSheet(`<h3>${id ? 'Editar compromisso' : 'Novo compromisso'}</h3>
  <form onsubmit="return salvarAgenda(event,'${id || ''}')">
    <div class="g2"><label class="f"><span>Data *</span><input name="data" type="date" required value="${esc(a.data)}"></label>
    <label class="f"><span>Hora</span><input name="hora" type="time" value="${esc(a.hora)}"></label></div>
    <label class="f"><span>Tipo</span><select name="tipo">${opts(TIPOS_AG, a.tipo)}</select></label>
    <label class="f"><span>Título</span><input name="titulo" placeholder="Ex.: Levar catálogo novo" value="${esc(a.titulo)}"></label>

function fvTotal() {
  const f = $('#fv'); if (!f) return 0;
  const t = r2(sum(F.itens.map(i => i.qtd * i.preco)) - (+f.desconto.value || 0));
  $('#fvTot').textContent = brl(t);
  if (f.forma.value === 'A prazo') { const n = +f.parcelas.value, rest = r2(t - (+f.entrada.value || 0));
    const base = Math.floor(rest / n * 100) / 100, ult = r2(rest - base * (n - 1));
    $('#fvParcInfo').textContent = rest > 0 ? (n > 1 && ult !== base ? `${n - 1}× de ${brl(base)} + 1× de ${brl(ult)}` : `${n}× de ${brl(base)}`) + (+f.entrada.value ? ` + entrada de ${brl(f.entrada.value)}` : '') : ''; }
  return t;
}
function fvForma() { $('#fvPrazo').style.display = $('#fv').forma.value === 'A prazo' ? '' : 'none'; fvTotal(); }
function salvarVenda(e) {
  e.preventDefault(); const f = e.target;
  const itens = F.itens.filter(i => String(i.nome).trim() && i.qtd > 0).map(i => ({...i, nome:String(i.nome).trim(), qtd:+i.qtd, preco:r2(i.preco), custo:r2(i.custo)}));
  if (!itens.length) { toast('Adicione pelo menos um item'); return false; }
  const total = fvTotal(); if (total < 0) { toast('Desconto maior que o total'); return false; }
  const nomeCli = f.cliente.value.trim(); let cli = null;
  if (nomeCli) { cli = DB.clientes.find(c => norm(c.nome) === norm(nomeCli));
    if (!cli) { cli = salvar('clientes', {nome:nomeCli, telefone:soDig(F.telefone), criadoEm:hoje()}, true); toast('Nova cliente cadastrada: ' + nomeCli); } }
  const data = f.data.value || hoje(), forma = f.forma.value, old = F.orig;
  let pagamentos = [], parcelas = [];
  if (forma !== 'A prazo') pagamentos = [{data, valor:total, forma}];
  else {
    const entrada = r2(+f.entrada.value || 0);
    if (entrada > total) { toast('Entrada maior que o total'); return false; }
    if (old && old.forma === 'A prazo') pagamentos = (old.pagamentos || []).filter(p => p.forma !== 'Entrada');
    if (entrada > 0) pagamentos.unshift({data, valor:entrada, forma:'Entrada'});
    const n = +f.parcelas.value || 1, rest = r2(total - entrada), base = Math.floor(rest / n * 100) / 100, venc1 = f.venc1.value || addDias(data, 30);
    for (let i = 0; i < n; i++) parcelas.push({venc:addMeses(venc1, i), valor:i === n - 1 ? r2(rest - base * (n - 1)) : base});
    if (rest <= 0) parcelas = [];
  }
  const v = {...(old || {}), data, clienteId:cli ? cli.id : null, clienteNome:cli ? cli.nome : '', telefone:cli ? cli.telefone || '' : '',
    itens, desconto:r2(+f.desconto.value || 0), total, forma, pagamentos, parcelas, obs:f.obs.value.trim()};
  if (old) v.id = old.id;
  movEstoque(old ? old.itens : [], itens);
  salvar('vendas', v, true);
  if (F.pedidoId) { const p = DB.pedidos.find(x => x.id === F.pedidoId); if (p) { p.status = 'vendido'; p.vendaId = v.id; salvar('pedidos', p, true); } }
  fecharSheet(render); toast('Venda salva ✓'); return false;
}
function movEstoque(antes, depois) {
  const d = {};
  antes.forEach(i => { if (i.produtoId) d[i.produtoId] = (d[i.produtoId] || 0) + (+i.qtd || 0); });
  depois.forEach(i => { if (i.produtoId) d[i.produtoId] = (d[i.produtoId] || 0) - (+i.qtd || 0); });
  Object.entries(d).forEach(([id, delta]) => { if (!delta) return; const p = DB.produtos.find(x => x.id === id); if (p) { p.qtd = (+p.qtd || 0) + delta; salvar('produtos', p, true); } });
}
function excluirVenda(id) {

function minProd(p) { return p.min !== '' && p.min != null ? +p.min : +CFG.estoqueMin; }

    : vazio(DB.produtos.length ? 'Nada encontrado' : 'Nenhum produto ainda', DB.produtos.length ? '' : 'Cadastre seus produtos para controlar o estoque e montar a vitrine.');
}
function toggleVitrine(id) { const p = DB.produtos.find(x => x.id === id); p.vitrine = !p.vitrine; salvar('produtos', p, true); toast(p.vitrine ? 'Na vitrine ✓' : 'Retirado da vitrine'); render(); }
let FOTO = '';
function formProduto(id) {

      <button type="button" class="link sm" onclick="FOTO='';fpThumbUpd()">Remover</button><div class="xs muted" style="margin-top:4px">A foto é reduzida automaticamente.</div></div></div>

    <div class="btns">${id ? `<button type="button" class="btn danger" onclick="perguntar('Excluir este produto?',()=>fecharSheet(()=>excluir('produtos','${id}')),'Excluir')">Excluir</button>` : `<button type="button" class="btn ghost" onclick="fecharSheet()">Cancelar</button>`}<button class="btn">Salvar</button></div></form>`);
}
function fpThumbUpd() { const t = $('#fpThumb'); t.style.backgroundImage = FOTO ? `url('${FOTO}')` : ''; t.textContent = FOTO ? '' : '📷'; }
async function fpFoto(inp) { const f = inp.files[0]; if (!f) return; try { FOTO = await comprimir(f); fpThumbUpd(); } catch (e) { toast('Não consegui ler a imagem'); } }
function comprimir(file, max = 420, q = .72) {
  return new Promise((ok, err) => { const r = new FileReader(); r.onerror = err; r.onload = () => { const img = new Image(); img.onerror = err;
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', q)); };
    img.src = r.result; }; r.readAsDataURL(file); });
}

  h += secao('Definir metas mensais') + `<form class="card" onsubmit="return salvarMetas(event)"><div class="g2">

</div>

  let podeArquivo = false;

async function enviarStatus() {

  catch (e) { if (e.name !== 'AbortError') toast('Não deu para abrir. Salve a imagem e poste pelo WhatsApp.'); }

function baixarStatus() {
  try { const a = document.createElement('a'); a.href = STATUS_IMG.url; a.download = 'vitrine-status.png'; document.body.appendChild(a); a.click(); a.remove(); toast('Imagem salva'); }
  catch (e) { toast('Toque e segure a imagem para salvar'); }
}
function carregarImg(src) { return new Promise(ok => { if (!src) return ok(null); const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; }); }
function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function linhasTexto(ctx, txt, max, nMax) {
  const pal = String(txt).split(/\s+/), out = []; let l = '';
  for (const p of pal) { const t = l ? l + ' ' + p : p; if (ctx.measureText(t).width > max && l) { out.push(l); l = p; } else l = t; }
  if (l) out.push(l);
  if (out.length > nMax) { out.length = nMax; let u = out[nMax - 1]; while (ctx.measureText(u + '…').width > max && u.length) u = u.slice(0, -1); out[nMax - 1] = u + '…'; }
  return out;
}
async function gerarImagemStatus() {
  try { await Promise.all([document.fonts.load('700 120px Caveat'), document.fonts.load('800 40px Nunito'), document.fonts.load('700 40px Nunito')]); } catch (e) {}
  const W = 1080, H = 1920, c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d'), css = getComputedStyle(document.documentElement);
  const acc = '#B4505F', acc2 = '#93394A', ink = '#2B2326';
  // fundo
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, acc); g.addColorStop(1, acc2); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 3;
  for (let x = -H; x < W; x += 46) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + H, H); ctx.stroke(); }
  ctx.restore();
  // título
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = '700 128px Caveat, cursive'; ctx.fillText(CFG.lojaTitulo || CFG.nome, W / 2, 230);
  ctx.font = '700 44px Nunito, sans-serif'; ctx.globalAlpha = .92; ctx.fillText('com ' + CFG.nome, W / 2, 300); ctx.globalAlpha = 1;
  ctx.font = '800 50px Nunito, sans-serif'; ctx.fillText('✨ Novidades na vitrine ✨', W / 2, 400);
  // produtos
  const prods = DB.produtos.filter(p => p.vitrine && p.ativo !== false)
    .sort((a, b) => ((+b.qtd || 0) > 0) - ((+a.qtd || 0) > 0) || !!b.foto - !!a.foto || (b.atualizadoEm || 0) - (a.atualizadoEm || 0)).slice(0, 4);
  const px = 60, py = 460, pw = W - 120, ph = 1120;
  ctx.fillStyle = '#FFFFFF'; rrect(ctx, px, py, pw, ph, 48); ctx.fill();
  if (prods.length) {
    const imgs = await Promise.all(prods.map(p => carregarImg(p.foto)));
    const pad = 40, gap = 36, cols = prods.length === 1 ? 1 : 2, rows = Math.ceil(prods.length / cols);
    const cw = (pw - pad * 2 - gap * (cols - 1)) / cols, ch = (ph - pad * 2 - gap * (rows - 1)) / rows;
    prods.forEach((p, i) => {
      const cx = px + pad + (i % cols) * (cw + gap), cy = py + pad + Math.floor(i / cols) * (ch + gap);
      const ih = ch - 200;
      ctx.save(); rrect(ctx, cx, cy, cw, ih, 28); ctx.clip();
      ctx.fillStyle = '#F8E8EA'; ctx.fillRect(cx, cy, cw, ih);
      const im = imgs[i];
      if (im) { const s = Math.max(cw / im.width, ih / im.height), w = im.width * s, h = im.height * s; ctx.drawImage(im, cx + (cw - w) / 2, cy + (ih - h) / 2, w, h); }
      else { ctx.font = `${Math.min(cw, ih) * .35}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🛍️', cx + cw / 2, cy + ih / 2); ctx.textBaseline = 'alphabetic'; }
      ctx.restore();
      ctx.textAlign = 'left'; ctx.fillStyle = '#7C6F72'; ctx.font = '700 28px Nunito, sans-serif';
      if (p.marca) ctx.fillText(p.marca, cx + 4, cy + ih + 40);
      ctx.fillStyle = ink; ctx.font = '800 34px Nunito, sans-serif';
      linhasTexto(ctx, p.nome, cw - 8, 2).forEach((l, k) => ctx.fillText(l, cx + 4, cy + ih + 82 + k * 40));
      ctx.fillStyle = acc; ctx.font = '800 44px Nunito, sans-serif'; ctx.fillText(brl(p.preco), cx + 4, cy + ch - 6);
    });
  } else {
    ctx.fillStyle = ink; ctx.textAlign = 'center'; ctx.font = '800 48px Nunito, sans-serif'; ctx.fillText('Confira os produtos', W / 2, py + ph / 2 - 20);
    ctx.font = '700 40px Nunito, sans-serif'; ctx.fillStyle = '#7C6F72'; ctx.fillText('no link da minha loja', W / 2, py + ph / 2 + 40);
  }
  // rodapé
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = '800 56px Nunito, sans-serif'; ctx.fillText('Faça seu pedido pelo link 👇', W / 2, 1690);
  if (CFG.whatsapp) { ctx.font = '700 42px Nunito, sans-serif'; ctx.globalAlpha = .92; ctx.fillText('ou chame no WhatsApp ' + fmtTel(CFG.whatsapp), W / 2, 1770); ctx.globalAlpha = 1; }
  const url = c.toDataURL('image/png');
  const blob = await new Promise(ok => c.toBlob(ok, 'image/png'));
  return {url, file:new File([blob], 'vitrine-status.png', {type:'image/png'})};
}

  return false;
}

// =====================================================================
// INÍCIO
// =====================================================================
(async function boot() {
  aplicarTema();
  try { if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && LOJA_ID === null) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
  if (USE_FB) { try { await fbInit(); } catch (e) { $('#app').innerHTML = vazio('Sem conexão', 'Não foi possível carregar. Verifique a internet.'); return; } }
  if (LOJA_ID !== null) return iniciarLoja();
  if (USE_FB) {
    $('#app').innerHTML = '<div class="empty" style="padding-top:30vh">Carregando…</div>';
    FB.auth.onAuthStateChanged(u => { if (u) { USER = u; assinar(); render(); } else { USER = null; DB = {clientes:[], agenda:[], produtos:[], vendas:[], lancamentos:[], pedidos:[]}; telaLogin(); } });
  } else { lsLoad(); render(); }
})();
</script>
</body>
</html>
